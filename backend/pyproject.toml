[project]
name = "open-breakout-scanner"
version = "0.1.0"
description = "Self-hosted momentum/breakout scanner for Indian equities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.9.0",
]

[tool.setuptools]
packages = ["backend"]
